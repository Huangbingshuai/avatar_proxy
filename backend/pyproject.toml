[project]
name = "avatar-proxy-backend"
version = "1.0.0"
description = "FastAPI gateway for Volcengine Ark private avatar assets"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "pydantic-settings==2.10.1",
  "tos==2.9.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
